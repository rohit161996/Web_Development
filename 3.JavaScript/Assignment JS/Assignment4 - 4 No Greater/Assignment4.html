<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4</title>
    <style>
        body{
            background-color: rgb(218, 218, 218);
        }
        section{
            width: 500px;
            border-radius: 5px;
            border: 5px solid green;
            padding: 20px 40px;
            text-align: center;
            background-color: rgb(231, 231, 231);

            /* Take section to the center */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #d2>div{
            display: inline-block;
            width: 380px;
            margin-bottom: 10px;
        }
        label{
            float: left;
        }
        input{
            float: right;
            border: none;
            border-bottom: 2px green solid;
            background-color: transparent;
        }
        button{
            color: white;
            border-radius: 5px;
            padding: 5px 10px;
            margin-top: 20px;
            background-color: green;
        }
    </style>
</head>
<body>
    <section>
        <div id="d1">
            <h1>Enter Four Numbers</h1>
        </div>
        <hr/>
        <div id="d2">
            <div>
                <label for="">Enter the First Number:</label>
                <input type="text" placeholder="Enter a Number" id="num1">
            </div>            
            <div>
                <label for="">Enter the Second Number:</label>
                <input type="text" placeholder="Enter a Number" id="num2">
            </div>            
            <div>
                <label for="">Enter the Third Number:</label>
                <input type="text" placeholder="Enter a Number" id="num3">
            </div>            
            <div>
                <label for="">Enter the Fourth Number:</label>
                <input type="text" placeholder="Enter a Number" id="num4">
            </div>

            <p id="ans"></p>

            <button onclick="f1()">Find Greatest</button>
        </div>
    </section>
</body>
<script>
    function f1(){
        var num1 = parseInt(document.getElementById("num1").value);
        var num2 = parseInt(document.getElementById("num2").value);
        var num3 = parseInt(document.getElementById("num3").value);
        var num4 = parseInt(document.getElementById("num4").value);
        var ans = document.getElementById("ans");
        // if((num1 > num2) && (num1 > num3) && (num1 > num4)){
        //     ans.innerHTML = num1;
        // }
        // if((num2 > num1) && (num2 > num3) && (num2 > num4)){
        //     ans.innerHTML = num2;
        // }
        // if((num3 > num1) && (num3 > num2) && (num3 > num4)){
        //     ans.innerHTML = num3;
        // }
        // else{
        //     ans.innerHTML = num4;
        // }

        ans.innerHTML = Math.max(num1, num2, num3, num4);
    }
</script>
</html>
