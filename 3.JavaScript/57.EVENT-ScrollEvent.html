<!DOCTYPE html>
<html>
    <head>
        <title>JS ex</title>
        <style>
            body{
                height: 1000px;
            }
        </style>
    </head>
    <body onscroll="f1()">
        <h1>Scroll Event example:</h1>
        <p id='para'></p>
    </body>
    <script>
        var p=document.getElementById("para");
        function f1(){
            p.innerHTML+="Rahul ";
        }
    </script>
</html>
