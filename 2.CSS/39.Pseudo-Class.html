<!DOCTYPE html>
<html>

<head>
    <title>My Page</title>
    <style>
        a:hover {
            color: red;
        }

        input:focus {
            border: 5px solid green;
        }

        ul li:first-child {
            font-weight: bold;
        }

        input:checked {
            outline: 2px solid green;
        }
    </style>
</head>

<body>
    <a href="#">Hover over this link</a><br><br>
    <input type="text" placeholder="Click me"><br><br>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>
    <input type="checkbox"> Check me
</body>

</html>
