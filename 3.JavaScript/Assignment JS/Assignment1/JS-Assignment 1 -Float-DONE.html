<html>
    <head>
        <title>JS</title>
        <style>
            body{
                margin: 0;
            }
            section{
                background-color: antiquewhite;
                padding: 20px;
                border: 2px solid black;
                width: 350px;
                text-align: center;

                /* Make div in center of page */
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            #d1{
                height: 60px;
            }
            #d1>h1{
                float: left;
            }
            #d1>button{
                float: right;
                margin-top:20px ;
            }

            #d2{
                height: 150px;
            }
            #d2-1{
                float: left;
                width: 160px;
            }
            #d2-2{
                float: right;
                width: 160px;
            }
            
            button{
                padding: 5px 10px;
                background-color: cyan;
                border: 1px solid red;
                border-radius: 5px;
            }
        </style>
    </head>
    <body>
        <section>
            <div id="d1">
                <h1 id="a">This is India</h1>
                <button onclick="f1()">Change</button>
            </div>
            <hr/>
            <div id="d2">
                <div id="d2-1">
                    <h1 id="b">I am Rahul Chauhan</h1>
                    <button onclick="f2()">Change</button>
                </div>
                <div id="d2-2">
                    <h1 id="c">I am Developer</h1>
                    <button onclick="f3()">Change</button>
                </div>
            </div>
            <button onclick="f4()">Alert Message</button>
        </section>
    </body>
    <script>
        function f1(){
            var x=document.getElementById("a");
            x.innerHTML="This is USA";
        }
        function f2(){
            var x=document.getElementById("b");
            x.innerHTML="I am INCAPP";
        }
        function f3(){
            var x=document.getElementById("c");
            x.innerHTML="I am Trainer";
        }
        function f4(){
            alert("Hello Incapp");
        }
    </script>
</html>
