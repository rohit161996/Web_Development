<!DOCTYPE html>
<html>
    <head>
        <title>JS ex</title>
    </head>
    <body>
        <h1>Key Event example:</h1>
        <input type="text" onkeydown="f1()" onkeyup="f2()" />
        <input type="text"/>
        <p id="para"></p>
    </body>
    <script>
        function f1(){
            var x=document.getElementById("para");
            x.innerHTML="hi incapp";
        }
        function f2(){
            var x=document.getElementById("para");
            x.innerHTML="bye incapp";
        }
    </script>
</html>
