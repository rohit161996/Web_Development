<!DOCTYPE html>
<html>
    <head>
        <title>JQ Ex</title>
        <style>
            section{
                width: 400px;
                border: 5px solid green;
                border-radius: 5px;
                background-color: lightgray;
                padding: 20px 40px;

                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            input{
                float: right;
                border-radius: 5px;
            }
            label{
                float: left;
            }
            button{
                border: none;
                padding: 10px 20px;
                margin: 10px;
                color: white;
                background-color: green;
                border-radius: 5px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <section>
            <h1>Welcome to my Page.</h1>
            <hr/>
            <h2>Hello INCAPP</h2>
            <p id="para">This is Rahul Chauhan.</p>
            <h2>Lorem ipsum dolor sit amet.</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Commodi, laboriosam!</p>
            <button id="b1">Click</button>
        </section>
    </body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
       $("#b1").click(function(){
            $("#para").text("I am Learning JQUERY"); //Change Text
            $("h2").text("I am Rahul Chauhan"); //Change Text
       });
    </script>
</html>
