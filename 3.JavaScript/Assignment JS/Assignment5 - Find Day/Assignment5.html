<!DOCTYPE html>
<html>
    <head>
        <title>JS ex</title>
    </head>
    <body>
        <h1>Find Day App</h1>
        <hr/>
        <input type="number" id="num" placeholder="Enter a number"/>
        <br/><br/>
        <button onclick="f1()" >Find Day</button>
        <p id='para'></p>
    </body>
    <script>
        function f1(){
            var p=document.getElementById("para");
            var x=parseInt(document.getElementById("num").value);
            var data;
            switch(x){
                case 1:
                    data="Monday";
                    break;
                case 2:
                    data="Tuesday";
                    break;
                case 3:
                    data="Wednesday";
                    break;
                case 4:
                    data="Thursday";
                    break;
                case 5:
                    data="Friday";
                    break;
                case 6:
                    data="Saturday";
                    break;
                case 7:
                    data="Sunday";
                    break;
                default:
                    data="Invalid Day!!!";
            }
            p.innerHTML=data;
        }
    </script>
</html>
