<!DOCTYPE html>
<html>
    <head>
        <title>JS ex</title>
    </head>
    <body>
        <h1>Welcome to my website</h1>
        <button id="b1">Hide</button>
        <button id="b2">Show</button>
        <button id="b3">Hide/show</button>
        <div>
            <h2>Hello INCAPP</h2>
            <p>Hi India</p>
        </div>
        <p>INCAPP is BEST</p>
    </body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $("#b1").click(function(){
            $("div").hide(2000);
        });
        $("#b2").click(function(){
            $("div").show(2000);
        });
        $("#b3").click(function(){
            $("div").toggle(2000);
            // $("div").toggle();
        });
    </script>
</html>
