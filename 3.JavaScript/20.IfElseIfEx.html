<!DOCTYPE html>
<html>
    <head>
        <title>JS ex</title>
    </head>
    <body>
        <h1>Greater Amoung 3 Numbers.</h1>
        <hr/>
        <input type="number" id="num1" placeholder="Enter a number"/>
        <br/><br/>
        <input type="number" id="num2" placeholder="Enter a number"/>
        <br/><br/>
        <input type="number" id="num3" placeholder="Enter a number"/>
        <br/><br/>
        <button onclick="f1()" >Submit</button>
        <p id='para'></p>
    </body>
    <script>
        function f1(){
            var p=document.getElementById("para");
            var x=parseInt(document.getElementById("num1").value);
            var y=parseInt(document.getElementById("num2").value);
            var z=parseInt(document.getElementById("num3").value);
            if(x==y && x==z){
                p.innerHTML="All are Equal";
            }else if(x>y && x>z){
                p.innerHTML=x+" is Greatest!";
            }else if(y>z){
                p.innerHTML=y+" is Greatest!";
            }else{
                p.innerHTML=z+" is Greatest!";
            }
        }
    </script>
</html>
